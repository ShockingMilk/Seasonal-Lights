name: "Mixed Zone Test"

zones:
  - porch
  - front_window
  - doorway
  - side_window

effects:

  porch:
    type: "solid"
    color:
      r: 255
      g: 120
      b: 40
    brightness: 0.25

  front_window:
    type: "pulse"
    color:
      r: 255
      g: 180
      b: 90
    brightness: 0.25

  doorway:
    type: "solid"
    color:
      r: 255
      g: 255
      b: 255
    brightness: 0.20

  side_window:
    type: "rainbow"
    brightness: 0.25